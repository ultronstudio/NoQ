<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#00b7ef">
    <title>Jste offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f9fa; color: #212529; font: 1rem/1.6 system-ui, sans-serif; }
        main { max-width: 32rem; padding: 2rem; text-align: center; }
        h1 { font-size: 2rem; line-height: 1.2; }
        a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; background: #00b7ef; color: #092733; border-radius: .5rem; font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid #212529; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <h1>Jste offline</h1>
        <p>Pro aktuální stav fronty a práci s aplikací potřebujete připojení k internetu.</p>
        <p>Po obnovení připojení načtěte stránku znovu. Tato obrazovka nepotvrzuje žádnou změnu ve frontě.</p>
        <a href="">Zkusit znovu</a>
    </main>

    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
